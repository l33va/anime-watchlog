<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8D8C9">
<meta name="color-scheme" content="light">
<title>Anime Watchlog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #E8D8C9;
  --surface: #4B607F;
  --ink: #141414;
  --muted: #4B607F;
  --line: #141414;
  --bar: #141414;
  --accent: #F3701E;
  --accent-ink: #141414;
  --slate: #4B607F;
  --cream: #E8D8C9;
  --night: #141414;
  --font-display: "Arial Black", "Archivo Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --font-body: ui-monospace, "Space Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --font-mono: ui-monospace, "Space Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.kicker { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--slate); }
.kicker i { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--night); display: block; }
h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(56px, 20vw, 84px);
  letter-spacing: -0.02em;
  line-height: 0.86;
  text-transform: uppercase;
  margin: 14px 0 0;
}
h1 .b { color: var(--slate); }
h1 .o { color: var(--accent); }
.sub { color: var(--slate); margin: 12px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--night); outline-offset: 2px; }
.toast { background: var(--night); color: var(--cream); padding: 12px 14px; border-radius: 12px; font-size: 13px; }
.toast[hidden] { display: none; }
.add {
  background: var(--night);
  color: var(--cream);
  border-radius: 18px;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  align-items: end;
}
.add .field:first-child { grid-column: 1 / -1; }
.add .primary { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A9BAD4; }
.add input, .add select {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  background: var(--cream);
  color: var(--night);
  border: 0;
  border-radius: 10px;
  font-size: 16px; /* stops mobile browsers zooming on focus */
}
.add :focus-visible { outline-color: var(--accent); }
.primary {
  height: 48px;
  padding: 0 18px;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 12px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 17px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.primary:disabled { opacity: 0.5; }
.bar { display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; flex-direction: column; gap: 10px; }
.tab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 20px;
  border: 0;
  border-radius: 18px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 22px;
  text-transform: uppercase;
  text-align: left;
}
.tab:nth-child(1) { background: var(--accent); color: var(--night); }
.tab:nth-child(2) { background: var(--slate); color: var(--cream); }
.tab:nth-child(3) { background: var(--night); color: var(--cream); }
.tab .n { font-family: var(--font-mono); font-weight: 700; font-size: 15px; }
.tab[aria-selected="true"] { height: 72px; font-size: 28px; }
.tab[aria-selected="true"] .n::after { content: " \25CF"; }
.search {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  background: none;
  border: 3px solid var(--night);
  border-radius: 12px;
  font-size: 16px;
}
.search::placeholder { color: var(--slate); opacity: 1; }
.list { display: flex; flex-direction: column; gap: 12px; }
.row {
  --ink: #E8D8C9;
  --muted: #E8D8C9;
  --line: rgba(232, 216, 201, 0.45);
  --bg: #141414;
  background: var(--slate);
  color: var(--ink);
  border-radius: 20px;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px 14px;
  align-items: center;
  overflow: hidden;
}
.row h2 { font-family: var(--font-display); font-size: 22px; font-weight: 900; line-height: 1.05; text-transform: uppercase; margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 12px; margin-top: 4px; }
.stop { text-align: right; font-family: var(--font-display); font-weight: 900; }
.stop .big { font-size: 40px; line-height: 0.95; color: var(--accent); text-shadow: 2px 2px 0 var(--night); text-transform: uppercase; }
.stop .of { font-family: var(--font-mono); font-size: 11px; font-weight: 700; display: block; margin-top: 6px; }
.prog { grid-column: 1 / -1; height: 14px; background: var(--night); border-radius: 7px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--accent); border-radius: 7px; }
.prog.indet span { width: 100%; opacity: 0.25; }
.tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.step { width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--night); color: var(--cream); font-size: 22px; line-height: 1; }
.step.plus { background: var(--accent); color: var(--night); font-weight: 700; }
.epin { width: 68px; height: 48px; text-align: center; font-family: var(--font-mono); font-size: 16px; background: var(--night); color: var(--cream); border: 0; border-radius: 14px; }
.note { grid-column: 1 / -1; width: 100%; min-width: 0; height: 44px; padding: 0 12px; font-size: 16px; background: var(--night); color: var(--cream); border: 0; border-radius: 12px; }
.note::placeholder, .epin::placeholder { color: #A9BAD4; opacity: 1; }
.ghost { height: 44px; padding: 0 14px; background: none; border: 2px solid currentColor; border-radius: 12px; color: var(--ink); font-size: 13px; font-weight: 700; }
.bar ~ .backup .ghost, .backup .ghost { color: var(--night); }
.ghost.danger.armed { background: var(--accent); border-color: var(--accent); color: var(--night); }
.spacer { flex: 1; }
.stars { display: flex; gap: 0; }
.star { background: none; border: 0; padding: 4px; font-size: 22px; line-height: 1; color: var(--night); }
.star.on { color: var(--cream); }
/* Cards with a cover: the picture fills the card, a dark fade keeps text readable. */
.row.has-cover {
  --bg: rgba(20, 20, 20, 0.62);
  border-color: transparent;
  background-image:
    linear-gradient(0deg, rgba(20, 20, 20, 0.86) 0%, rgba(20, 20, 20, 0) 62%),
    linear-gradient(90deg, rgba(20, 20, 20, 0.86) 0%, rgba(20, 20, 20, 0.34) 100%),
    var(--cover);
  background-size: cover;
  background-position: center 22%;
  background-repeat: no-repeat;
}
.row.has-cover h2, .row.has-cover .stop { text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65); }
.row.has-cover .ghost { background: rgba(20, 20, 20, 0.5); }
.tools.minor .ghost { height: 40px; font-size: 12px; padding: 0 12px; }
.coverpanel {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.coverpanel .ghost { height: 40px; font-size: 12px; padding: 0 12px; }
.coverpanel .hint { flex: 1 1 100%; font-size: 12px; color: var(--muted); }
.empty { border: 3px dashed var(--night); border-radius: 18px; padding: 28px 18px; text-align: center; color: var(--slate); font-weight: 700; }
.empty strong { display: block; color: var(--night); font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 20px; margin-bottom: 4px; }
.backup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; color: var(--slate); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.backup input[type=file] { display: none; }
@media (prefers-reduced-motion: no-preference) { .prog span { transition: width 0.25s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span>Daily portfolio // Watchlog</span><i aria-hidden="true"></i></div>
    <h1>Anime<br>Watch<br><span class="b">Log</span><span class="o">.</span></h1>
    <p class="sub">Where you stopped, what you finished, what is next.</p>
  </header>

  <div id="toast" class="toast" role="status" hidden></div>

  <form id="addForm" class="add" autocomplete="off">
    <div class="field">
      <label for="fTitle">Title</label>
      <input id="fTitle" type="text" required maxlength="140" placeholder="e.g. Frieren: Beyond Journey's End">
    </div>
    <div class="field">
      <label for="fTotal">Episodes</label>
      <input id="fTotal" type="number" min="1" max="3000" inputmode="numeric" placeholder="optional">
    </div>
    <div class="field">
      <label for="fList">List</label>
      <select id="fList">
        <option value="planned">Planned</option>
        <option value="watching">Watching</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button id="fAdd" class="primary" type="submit">Add title</button>
  </form>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <input id="q" class="search" type="search" placeholder="Search titles" aria-label="Search titles">
  </div>

  <div id="list" class="list"></div>

  <div class="backup">
    <span>Saved on this phone.</span>
    <button id="exportBtn" class="ghost" type="button">Export backup</button>
    <button id="importBtn" class="ghost" type="button">Import backup</button>
    <input id="importFile" type="file" accept="application/json,.json">
    <input id="coverFile" type="file" accept="image/*">
  </div>
</div>

<script>
(function () {
  var KEY = "watchlog.items.v1";
  var TABKEY = "watchlog.tab";
  var TABS = [
    { key: "watching", label: "Watching" },
    { key: "planned", label: "Planned" },
    { key: "completed", label: "Completed" }
  ];
  var state = { items: [], tab: "watching", q: "", armed: null };
  var renderTimer = null;
  var toastTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      state.items = Array.isArray(arr) ? arr : [];
    } catch (e) { state.items = []; }
    try {
      var t = localStorage.getItem(TABKEY);
      if (TABS.some(function (x) { return x.key === t; })) state.tab = t;
    } catch (e) {}
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state.items)); }
    catch (e) { toast("Could not save. Storage may be full or blocked."); }
  }
  function setTab(k) {
    state.tab = k;
    try { localStorage.setItem(TABKEY, k); } catch (e) {}
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }

  // ---------- helpers ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function today() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s + "T00:00:00");
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  // Button taps re-render at once. Field edits wait a moment so a tap on the
  // next button is not lost when the field loses focus.
  function save(item, patch, deferred) {
    Object.keys(patch).forEach(function (k) { item[k] = patch[k]; });
    item.updatedAt = Date.now();
    persist();
    if (deferred) {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(safeRender, 200);
    } else {
      render();
    }
  }
  // Redraw, but not while a field inside the list has the keyboard open.
  function safeRender(tries) {
    tries = typeof tries === "number" ? tries : 0;
    var a = document.activeElement;
    if (a && a.tagName === "INPUT" && $("list").contains(a) && tries < 20) {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(function () { safeRender(tries + 1); }, 800);
      return;
    }
    render();
  }
  function byId(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }

  // ---------- covers ----------
  var LOOKUP = "query($s:String){Page(perPage:1){media(search:$s,type:ANIME,sort:SEARCH_MATCH){coverImage{extraLarge large}}}}";
  // Resolves a picture address, or null when AniList has no match. Rejects on network or rate-limit errors.
  function lookup(title) {
    return fetch("https://graphql.anilist.co", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: LOOKUP, variables: { s: title } })
    }).then(function (r) {
      if (r.status === 429) { var e = new Error("rate"); e.rate = true; throw e; }
      return r.json();
    }).then(function (j) {
      var m = j && j.data && j.data.Page && j.data.Page.media && j.data.Page.media[0];
      var c = m && m.coverImage;
      return (c && (c.extraLarge || c.large)) || null;
    });
  }
  function findCover(item, manual) {
    if (manual) toast("Looking for the cover…");
    return lookup(item.title).then(function (url) {
      if (url) {
        save(item, { cover: url, coverSrc: "auto", coverTried: true }, true);
        if (manual) toast("Cover added.");
      } else {
        item.coverTried = true;
        persist();
        if (manual) toast("No cover found for this title. Try Choose image.");
      }
    }).catch(function (e) {
      if (manual) toast(e && e.rate ? "AniList is busy. Try again in a minute." : "Could not reach AniList. Check your connection.");
    });
  }
  // On start, look up covers for titles that never had a lookup. One at a time, to stay under AniList's rate limit.
  function backfill() {
    if (navigator.onLine === false) return;
    var queue = state.items.filter(function (i) { return !i.cover && !i.coverTried; });
    (function next() {
      var it = queue.shift();
      if (!it) return;
      findCover(it, false).then(function () { setTimeout(next, 800); });
    })();
  }
  // Shrink a picture from the phone so it stays small in storage.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var u = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 560, w = img.naturalWidth, ht = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, ht));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(ht * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        resolve(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = function () { URL.revokeObjectURL(u); reject(new Error("img")); };
      img.src = u;
    });
  }
  function coverBtn(item) {
    return h("button", {
      class: "ghost", type: "button", text: item.cover ? "Cover" : "Add cover",
      onclick: function () { state.coverFor = state.coverFor === item.id ? null : item.id; render(); }
    });
  }
  function coverPanel(item) {
    return h("div", { class: "coverpanel" },
      h("button", { class: "ghost", type: "button", text: "Find online", onclick: function () { findCover(item, true); } }),
      h("button", { class: "ghost", type: "button", text: "Choose image", onclick: function () { state.uploadFor = item.id; $("coverFile").click(); } }),
      item.cover ? h("button", { class: "ghost", type: "button", text: "Clear cover", onclick: function () {
        save(item, { cover: null, coverSrc: null, coverTried: true });
      } }) : null,
      h("span", { class: "spacer" }),
      h("button", { class: "ghost", type: "button", text: "Done", onclick: function () { state.coverFor = null; render(); } }),
      h("div", { class: "hint", text: "Find online looks the title up on AniList. Choose image uses a picture from your phone." }));
  }
  function decorate(row, item) {
    if (item.cover) {
      row.classList.add("has-cover");
      row.style.setProperty("--cover", 'url("' + String(item.cover).replace(/"/g, "%22") + '")');
    }
    if (state.coverFor === item.id) row.appendChild(coverPanel(item));
    return row;
  }
  function setEp(item, n, deferred) {
    n = Math.max(0, Math.floor(Number(n) || 0));
    if (item.total && n >= item.total) {
      save(item, { ep: item.total, status: "completed", finishedAt: today() }, deferred);
    } else {
      save(item, { ep: n }, deferred);
    }
  }
  function counts() {
    var c = { watching: 0, planned: 0, completed: 0 };
    state.items.forEach(function (i) { if (c[i.status] != null) c[i.status]++; });
    return c;
  }

  // ---------- rendering ----------
  function renderTabs() {
    var c = counts();
    var box = $("tabs");
    box.textContent = "";
    TABS.forEach(function (t) {
      box.appendChild(h("button", {
        class: "tab", role: "tab", type: "button",
        "aria-selected": String(state.tab === t.key),
        onclick: function () { setTab(t.key); state.armed = null; render(); }
      }, t.label, h("span", { class: "n", text: String(c[t.key]) })));
    });
  }
  function sortFor(tab, a, b) {
    if (tab === "planned") return (a.addedAt || 0) - (b.addedAt || 0);
    if (tab === "completed") return String(b.finishedAt || "").localeCompare(String(a.finishedAt || "")) || (b.updatedAt || 0) - (a.updatedAt || 0);
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  }
  function removeBtn(item) {
    var armed = state.armed === item.id;
    return h("button", {
      class: "ghost danger" + (armed ? " armed" : ""), type: "button",
      onclick: function () {
        if (!armed) { state.armed = item.id; render(); return; }
        state.armed = null;
        state.items = state.items.filter(function (i) { return i.id !== item.id; });
        persist();
        render();
      }
    }, armed ? "Confirm remove" : "Remove");
  }
  function progress(item) {
    var pct = item.total ? Math.min(100, Math.round(((item.ep || 0) / item.total) * 100)) : 0;
    var bar = h("div", { class: "prog" + (item.total ? "" : " indet"), role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(pct) });
    var fill = h("span");
    if (item.total) fill.style.width = pct + "%";
    bar.appendChild(fill);
    return bar;
  }
  function watchingRow(item) {
    var ep = item.ep || 0;
    var stop = h("div", { class: "stop" },
      h("span", { class: "big", text: "Ep " + ep }),
      h("span", { class: "of", text: item.total ? "of " + item.total : "total unknown" }));
    var epin = h("input", { class: "epin", type: "number", min: "0", inputmode: "numeric", value: String(ep), "aria-label": "Episode you stopped at",
      onchange: function (e) { setEp(item, e.target.value, true); } });
    var note = h("input", { class: "note", type: "text", maxlength: "200", value: item.note || "", placeholder: "Where you left off (optional)", "aria-label": "Note",
      onchange: function (e) { save(item, { note: e.target.value.trim() }, true); } });
    return h("div", { class: "row" },
      h("div", {}, h("h2", { text: item.title }), h("div", { class: "meta", text: ep === 0 ? "Not started yet" : "Stopped after episode " + ep })),
      stop,
      progress(item),
      h("div", { class: "tools" },
        h("button", { class: "step", type: "button", "aria-label": "Back one episode", text: "−", onclick: function () { setEp(item, ep - 1); } }),
        epin,
        h("button", { class: "step plus", type: "button", "aria-label": "Watched one more episode", text: "+", onclick: function () { setEp(item, ep + 1); } }),
        h("span", { class: "spacer" }),
        h("button", { class: "ghost", type: "button", text: "Finished", onclick: function () {
          save(item, { status: "completed", finishedAt: today(), ep: item.total || ep });
        } })),
      note,
      h("div", { class: "tools minor" }, coverBtn(item), removeBtn(item)));
  }
  function plannedRow(item) {
    return h("div", { class: "row" },
      h("div", {}, h("h2", { text: item.title }), h("div", { class: "meta", text: item.total ? item.total + " episodes" : "Episode count not set" })),
      h("div"),
      h("div", { class: "tools minor" },
        h("button", { class: "primary", type: "button", text: "Start watching", onclick: function () {
          save(item, { status: "watching", ep: 0 });
        } }),
        h("span", { class: "spacer" }),
        coverBtn(item),
        removeBtn(item)));
  }
  function completedRow(item) {
    var stars = h("div", { class: "stars", role: "group", "aria-label": "Rating" });
    for (var s = 1; s <= 5; s++) (function (s) {
      stars.appendChild(h("button", {
        class: "star" + ((item.rating || 0) >= s ? " on" : ""), type: "button",
        "aria-label": s + " star" + (s > 1 ? "s" : ""), text: "★",
        onclick: function () { save(item, { rating: item.rating === s ? 0 : s }); }
      }));
    })(s);
    var meta = [];
    if (item.total) meta.push(item.total + " episodes");
    else if (item.ep) meta.push(item.ep + " episodes");
    if (item.finishedAt) meta.push("finished " + fmtDate(item.finishedAt));
    return h("div", { class: "row" },
      h("div", {}, h("h2", { text: item.title }), h("div", { class: "meta", text: meta.join(" · ") })),
      stars,
      h("div", { class: "tools minor" },
        h("button", { class: "ghost", type: "button", text: "Watch again", onclick: function () {
          save(item, { status: "watching", ep: 0, finishedAt: null });
        } }),
        h("span", { class: "spacer" }),
        coverBtn(item),
        removeBtn(item)));
  }
  var EMPTY = {
    watching: ["Nothing in progress", "Add a title above, or start one from your Planned list."],
    planned: ["Your watchlist is empty", "Add titles you want to watch. Start one and it moves to Watching."],
    completed: ["No finished titles yet", "Reach the last episode, or press Finished, and it lands here."]
  };
  function render() {
    clearTimeout(renderTimer);
    renderTabs();
    var list = $("list");
    list.textContent = "";
    var q = state.q.trim().toLowerCase();
    var rows = state.items.filter(function (i) {
      return i.status === state.tab && (!q || String(i.title).toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) { return sortFor(state.tab, a, b); });
    if (!rows.length) {
      var e = EMPTY[state.tab];
      list.appendChild(h("div", { class: "empty" }, h("strong", { text: q ? "No matches" : e[0] }), q ? "Try a different search." : e[1]));
      return;
    }
    rows.forEach(function (i) {
      var row = state.tab === "watching" ? watchingRow(i) : state.tab === "planned" ? plannedRow(i) : completedRow(i);
      list.appendChild(decorate(row, i));
    });
  }

  // ---------- events ----------
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("fList").value = state.tab;

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("fTitle").value.trim();
    if (!title) return;
    var total = parseInt($("fTotal").value, 10);
    var status = $("fList").value;
    var now = Date.now();
    var item = { id: uid(), title: title, status: status, ep: 0, total: total > 0 ? total : null, rating: 0, note: "", addedAt: now, updatedAt: now, finishedAt: null };
    if (status === "completed") { item.finishedAt = today(); item.ep = item.total || 0; }
    state.items.push(item);
    persist();
    $("fTitle").value = ""; $("fTotal").value = "";
    state.q = ""; $("q").value = "";
    setTab(status);
    render();
    $("fTitle").focus();
    if (navigator.onLine !== false) findCover(item, false);
  });

  $("coverFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    var item = byId(state.uploadFor);
    e.target.value = "";
    if (!f || !item) return;
    shrink(f).then(function (url) {
      state.coverFor = null;
      save(item, { cover: url, coverSrc: "custom", coverTried: true });
      toast("Cover saved.");
    }).catch(function () { toast("Could not read that image."); });
  });

  $("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify({ app: "watchlog", version: 1, exportedAt: new Date().toISOString(), items: state.items }, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = today() + "-anime-watchlog-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast("Backup saved to your Downloads.");
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(String(r.result));
        var incoming = Array.isArray(data) ? data : data.items;
        if (!Array.isArray(incoming)) throw new Error("bad");
        var byId = {};
        state.items.forEach(function (i) { byId[i.id] = i; });
        var added = 0;
        incoming.forEach(function (i) {
          if (!i || typeof i.title !== "string" || !i.title.trim()) return;
          if (["watching", "planned", "completed"].indexOf(i.status) === -1) return;
          if (!i.id) i.id = uid();
          if (!byId[i.id]) added++;
          byId[i.id] = i;
        });
        state.items = Object.keys(byId).map(function (k) { return byId[k]; });
        persist();
        render();
        toast("Imported. " + added + " new title" + (added === 1 ? "" : "s") + " added.");
      } catch (err) {
        toast("That file is not a Watchlog backup.");
      }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  load();
  $("fList").value = state.tab;
  render();
  setTimeout(backfill, 1200);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
