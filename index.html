<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D2D2CE">
<meta name="color-scheme" content="light dark">
<title>Anime Watchlog</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("watchlog.theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --desk: #D2D2CE;
  --body: #E7E7E4;
  --edge: #B7B7B2;
  --key: #F6F6F3;
  --ink: #111111;
  --label: #5A5A55;
  --lcd: #0C0D0C;
  --lcd-ink: #EDEDE8;
  --lcd-dim: #8B8D88;
  --m: #FF5A1F;      /* mode colour on the body */
  --m-ink: #111111;
  --ml: #FF6A2B;     /* mode colour on the screen */
  --inv: #111111;    /* inverted keys and the selected track */
  --inv-ink: #FFFFFF;
  --inv-dim: #D0D0CB;
  --shade: #A9A9A4;
  --hi: #FFFFFF;
  --field: #F6F6F3;
  --dim: #8E8E89;
  --track: #C6C6C1;
  --led: #BDBDB8;
  --ph: #6E6E69;
  --font-ui: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --desk: #0E0E0D;
  --body: #1D1D1B;
  --edge: #3B3B38;
  --key: #2B2B29;
  --ink: #EDEDE8;
  --label: #A6A6A0;
  --inv: #EDEDE8;
  --inv-ink: #111111;
  --inv-dim: #44443F;
  --shade: #080808;
  --hi: rgba(255, 255, 255, 0.07);
  --field: #131312;
  --dim: #62625D;
  --track: #3B3B38;
  --led: #44443F;
  --ph: #8B8B85;
  color-scheme: dark;
}
:root[data-theme="dark"] .lcd { border-color: #2B2B29; }
body[data-tab="planned"] { --m: #2F6BFF; --m-ink: #FFFFFF; --ml: #7BA6FF; }
body[data-tab="completed"] { --m: #14A656; --m-ink: #111111; --ml: #3DD688; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--desk); }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.35;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 10px calc(28px + env(safe-area-inset-bottom, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- the unit ---------- */
.unit {
  max-width: 460px;
  margin-inline: auto;
  background: var(--body);
  border: 1px solid var(--edge);
  border-radius: 22px;
  box-shadow: 0 1px 0 var(--hi) inset, 0 10px 24px rgba(0, 0, 0, 0.14);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.plate { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 0; }
.brand { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.02em; text-transform: lowercase; }
.brand b { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.grille { flex: 1; min-width: 0; height: 14px; max-width: 110px; background-image: radial-gradient(circle, var(--dim) 1.4px, transparent 1.6px); background-size: 7px 7px; }
.snd { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; background: none; border: 0; font-size: 10px; letter-spacing: 0.08em; text-transform: lowercase; color: var(--label); }
.snd i { width: 30px; height: 16px; border-radius: 8px; background: var(--led); border: 1px solid var(--dim); position: relative; display: block; }
.snd i::after { content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px; border-radius: 50%; background: var(--key); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4); transition: transform 0.12s; }
.snd[aria-pressed="true"] i { background: var(--inv); border-color: var(--inv); }
.snd[aria-pressed="true"] i::after { background: var(--inv-ink); }
.snd[aria-pressed="true"] i::after { transform: translateX(14px); }
.label { font-size: 10px; letter-spacing: 0.08em; text-transform: lowercase; color: var(--label); }

/* ---------- screen ---------- */
.lcd {
  background: var(--lcd);
  color: var(--lcd-ink);
  border-radius: 12px;
  border: 3px solid #1E1F1E;
  padding: 12px;
  min-height: 178px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.lcd-top { display: flex; justify-content: space-between; gap: 8px; text-transform: lowercase; color: var(--lcd-dim); }
.lcd-top .mode { color: var(--ml); }
.lcd-top .mode::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--ml); margin-right: 6px; }
.lcd-main { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.art { width: 64px; height: 88px; border: 1px solid #3A3B39; background-image: repeating-linear-gradient(135deg, #2A2B2A 0 3px, transparent 3px 6px); display: block; overflow: hidden; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.15); }
.lcd h2 { margin: 0; font-family: var(--font-ui); font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lcd .meta { margin-top: 6px; color: var(--lcd-dim); text-transform: lowercase; }
.lcd .big { text-align: right; }
.seg { display: flex; gap: 4px; justify-content: flex-end; color: var(--ml); }
.seg svg { height: 46px; width: auto; display: block; }
.seg.small svg { height: 32px; }
.seg .off { opacity: 0.1; }
.lcd .of { display: block; margin-top: 6px; color: var(--lcd-dim); }
.lcd .stars { font-size: 17px; letter-spacing: 1px; color: var(--ml); white-space: nowrap; }
.lcd .stars s { text-decoration: none; opacity: 0.18; }
.ticks { display: flex; gap: 2px; height: 10px; }
.ticks span { flex: 1; min-width: 0; background: #2C2D2B; }
.ticks span.on { background: var(--ml); }
.ticks.bar { display: block; background: #2C2D2B; }
.ticks.bar span { display: block; height: 100%; background: var(--ml); }
.ticks.open { background-image: repeating-linear-gradient(90deg, #2C2D2B 0 4px, transparent 4px 7px); }
.lcd-msg { min-height: 14px; text-transform: lowercase; color: var(--lcd-dim); }
.lcd-msg.live { color: var(--lcd-ink); }
.lcd-msg.live::before { content: "> "; color: var(--ml); }
.lcd-empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; text-transform: lowercase; color: var(--lcd-dim); }
.lcd-empty strong { font-family: var(--font-ui); font-size: 17px; color: var(--lcd-ink); }
@media (prefers-reduced-motion: no-preference) {
  .lcd-msg.live::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
}

/* ---------- keys ---------- */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.key {
  min-height: 52px;
  padding: 6px 8px;
  background: var(--key);
  border: 1px solid var(--edge);
  border-radius: 10px;
  box-shadow: 0 3px 0 var(--shade), 0 1px 0 var(--hi) inset;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
  text-transform: lowercase;
  user-select: none;
  -webkit-user-select: none;
}
.key small { font-size: 10px; font-weight: 400; letter-spacing: 0.06em; color: var(--label); }
.key:active:not(:disabled), .key.down { transform: translateY(3px); box-shadow: 0 0 0 var(--shade), 0 1px 0 var(--hi) inset; }
.key:disabled { opacity: 0.45; cursor: default; }
.key.hot { background: var(--m); color: var(--m-ink); border-color: rgba(0, 0, 0, 0.35); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45); }
.key.hot small { color: inherit; }
.key.hot:active { box-shadow: none; }
.key.dark { background: var(--inv); color: var(--inv-ink); border-color: #000000; box-shadow: 0 3px 0 #555550; }
.key.dark small { color: var(--inv-dim); }
.key.round { border-radius: 50%; width: 60px; height: 60px; min-height: 60px; padding: 0; }
.mode { font-size: 12px; letter-spacing: 0.02em; flex-direction: row; gap: 8px; min-height: 48px; }
.mode .led { width: 8px; height: 8px; border-radius: 50%; background: var(--led); border: 1px solid var(--dim); flex: none; }
.mode .n { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--label); }
.mode[aria-selected="true"] .led { background: var(--m); border-color: rgba(0, 0, 0, 0.4); box-shadow: 0 0 6px var(--m); }
.mode[aria-selected="true"] { transform: translateY(2px); box-shadow: 0 1px 0 var(--shade), 0 1px 0 var(--hi) inset; }

.deck { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; }
.knobwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dial {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: repeating-conic-gradient(from -1deg, var(--dim) 0 2deg, transparent 2deg 24deg);
}
.dial::before { content: ""; grid-area: 1 / 1; width: 96px; height: 96px; border-radius: 50%; background: var(--body); }
.knob {
  grid-area: 1 / 1;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--m);
  border: 1px solid rgba(0, 0, 0, 0.35);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), 0 8px 12px rgba(0, 0, 0, 0.18);
  position: relative;
  touch-action: none;
  cursor: grab;
  z-index: 1;
}
.knob::after { content: ""; position: absolute; left: 50%; top: 7px; width: 5px; height: 22px; margin-left: -2.5px; border-radius: 3px; background: var(--m-ink); }
.knob[aria-disabled="true"] { background: var(--track); cursor: default; }
.knob[aria-disabled="true"]::after { background: var(--dim); }
.knob.turning { cursor: grabbing; }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad .w2 { grid-column: span 2; }
.pad .w3 { grid-column: 1 / -1; }
.rate { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rate .key { min-height: 46px; font-size: 14px; padding: 4px; }
.rate .key.lit { background: var(--m); color: var(--m-ink); border-color: rgba(0, 0, 0, 0.35); }

/* ---------- panels ---------- */
.panel { border-top: 1px solid var(--edge); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.inp {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 10px;
  background: var(--field);
  border: 1px solid var(--edge);
  border-radius: 8px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12) inset;
  font-size: 16px; /* stops mobile browsers zooming on focus */
}
.inp.mono { font-family: var(--font-mono); text-align: center; }
.inp::placeholder { color: var(--ph); opacity: 1; }
.detail { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
.detail .w { grid-column: 1 / -1; }
.fn { display: flex; flex-wrap: wrap; gap: 8px; }
.fn .key { flex: 1 1 0; min-height: 44px; font-size: 12px; font-weight: 400; }
.fn .key.armed { background: var(--inv); color: var(--inv-ink); border-color: #000000; font-weight: 700; }
.hint { font-size: 11px; color: var(--label); margin: 0; }

.sug { display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--field); border: 1px solid var(--edge); border-radius: 8px; }
.sug button { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 50px; padding: 4px 8px; background: none; border: 0; border-radius: 6px; text-align: left; }
.sug .pic { width: 30px; height: 42px; background: var(--track); display: block; overflow: hidden; }
.sug img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1); }
.sug .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sug .s { font-family: var(--font-mono); font-size: 11px; color: var(--label); white-space: nowrap; }
.sug button[aria-selected="true"] { background: var(--inv); color: var(--inv-ink); }
.sug button[aria-selected="true"] .s { color: inherit; }
.list { display: flex; flex-direction: column; gap: 4px; }
.trk {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 46px;
  padding: 6px 10px;
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  text-align: left;
  position: relative;
}
.trk .no, .trk .ep { font-family: var(--font-mono); font-size: 11px; color: var(--label); }
.trk .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.trk .p { position: absolute; left: 46px; right: 10px; bottom: 4px; height: 2px; background: var(--track); }
.trk .p span { display: block; height: 100%; background: var(--ink); }
.trk[aria-current="true"] { background: var(--inv); color: var(--inv-ink); }
.trk[aria-current="true"] .no { color: var(--m); }
:root:not([data-theme="dark"]) .trk[aria-current="true"] .no { color: var(--ml); }
.trk[aria-current="true"] .ep { color: var(--inv-dim); }
.trk[aria-current="true"] .p { background: var(--inv-dim); }
.trk[aria-current="true"] .p span { background: var(--m); }
.none { padding: 14px 10px; border: 1px dashed var(--dim); border-radius: 8px; color: var(--label); font-size: 12px; text-transform: lowercase; }

.rec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.rec .field:first-child { grid-column: 1 / -1; }
.rec .key.round { background: #E8421A; color: #FFFFFF; border-color: #9B2A0E; box-shadow: 0 3px 0 #9B2A0E; font-size: 11px; letter-spacing: 0.06em; }
.rec .key.round:active { box-shadow: none; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.foot .fn { flex: 0 0 auto; }
.foot .fn .key { flex: 0 0 auto; padding: 0 12px; }
.foot input[type=file] { display: none; }
.serial { text-align: center; margin: 12px 0 0; font-family: var(--font-mono); font-size: 10px; color: var(--label); text-transform: lowercase; }
@media (prefers-reduced-motion: no-preference) {
  .knob { transition: transform 0.08s linear; }
  .knob.turning { transition: none; }
}
</style>
</head>
<body data-tab="watching">
<main class="unit">
  <header class="plate">
    <h1 class="brand"><b>wl&#8211;1</b> anime watchlog</h1>
    <span class="grille" aria-hidden="true"></span>
    <button id="thm" class="snd" type="button" aria-pressed="false"><span>dark</span><i aria-hidden="true"></i></button>
    <button id="snd" class="snd" type="button" aria-pressed="false"><span>sound</span><i aria-hidden="true"></i></button>
  </header>

  <section id="lcd" class="lcd" aria-label="Selected title"></section>
  <div id="say" role="status" style="position:absolute;left:-9999px"></div>

  <div id="modes" class="modes" role="tablist" aria-label="Lists"></div>

  <section class="deck" aria-label="Controls">
    <div class="knobwrap">
      <div class="dial"><div id="knob" class="knob" role="slider" tabindex="0" aria-label="Episode"></div></div>
      <span id="knobLabel" class="label">episode</span>
    </div>
    <div id="pad" class="pad"></div>
  </section>

  <section id="detail" class="panel" aria-label="Selected title settings"></section>

  <section class="panel" aria-label="Titles">
    <div class="panel-head">
      <span id="listLabel" class="label">tracks</span>
    </div>
    <input id="q" class="inp" type="search" placeholder="search titles" aria-label="Search titles">
    <div id="list" class="list"></div>
  </section>

  <section class="panel" aria-label="Add a title">
    <span class="label">rec &#9679; new title</span>
    <form id="addForm" class="rec" autocomplete="off">
      <div class="field">
        <label class="label" for="fTitle">title</label>
        <input id="fTitle" class="inp" type="text" required maxlength="140" placeholder="e.g. Frieren: Beyond Journey's End" role="combobox" aria-autocomplete="list" aria-controls="sug" aria-expanded="false">
        <div id="sug" class="sug" role="listbox" aria-label="Title suggestions" hidden></div>
      </div>
      <div class="field">
        <label class="label" for="fTotal">episodes</label>
        <input id="fTotal" class="inp mono" type="number" min="1" max="3000" inputmode="numeric" placeholder="optional">
      </div>
      <div class="field">
        <label class="label" for="fList">list</label>
        <select id="fList" class="inp">
          <option value="planned">planned</option>
          <option value="watching">watching</option>
          <option value="completed">completed</option>
        </select>
      </div>
      <button id="fAdd" class="key round" type="submit">add</button>
    </form>
  </section>

  <footer class="panel foot">
    <span class="label">memory: this device</span>
    <div class="fn">
      <button id="exportBtn" class="key" type="button">export</button>
      <button id="importBtn" class="key" type="button">import</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json">
    <input id="coverFile" type="file" accept="image/*">
  </footer>
</main>
<p class="serial">wl&#8211;1 &#183; pocket watchlog &#183; no. 000001</p>

<script>
(function () {
  var KEY = "watchlog.items.v1";
  var TABKEY = "watchlog.tab";
  var SNDKEY = "watchlog.snd";
  var TABS = [
    { key: "watching", label: "watching" },
    { key: "planned", label: "planned" },
    { key: "completed", label: "completed" }
  ];
  var STEP = 24; // knob degrees per step
  var state = { items: [], tab: "watching", q: "", armed: null, sel: {}, coverFor: null, uploadFor: null, msg: "", preview: null, snd: false };
  var renderTimer = null;
  var toastTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      state.items = Array.isArray(arr) ? arr : [];
    } catch (e) { state.items = []; }
    try {
      var t = localStorage.getItem(TABKEY);
      if (TABS.some(function (x) { return x.key === t; })) state.tab = t;
      state.snd = localStorage.getItem(SNDKEY) === "1";
    } catch (e) {}
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state.items)); }
    catch (e) { toast("Could not save. Storage may be full or blocked."); }
  }
  function setTab(k) {
    state.tab = k;
    try { localStorage.setItem(TABKEY, k); } catch (e) {}
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }

  // ---------- helpers ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function toast(msg) {
    state.msg = msg;
    $("say").textContent = msg;
    renderLcd();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.msg = ""; renderLcd(); }, 4000);
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function today() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s + "T00:00:00");
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  // Key taps re-render at once. Field edits wait a moment so a tap on the
  // next key is not lost when the field loses focus.
  function save(item, patch, deferred) {
    Object.keys(patch).forEach(function (k) { item[k] = patch[k]; });
    item.updatedAt = Date.now();
    persist();

    if (state.coverFor === it.id) {
      grid.appendChild(h("div", { class: "fn w" },
        h("button", { class: "key", type: "button", text: "find online", onclick: function () { findCover(it, true); } }),
        h("button", { class: "key", type: "button", text: "choose image", onclick: function () { state.uploadFor = it.id; $("coverFile").click(); } }),
        it.cover ? h("button", { class: "key", type: "button", text: "clear", onclick: function () {
          save(it, { cover: null, coverSrc: null, coverTried: true });
        } }) : null));
      grid.appendChild(h("p", { class: "hint w", text: "Find online looks the title up on AniList. Choose image uses a picture from your phone." }));
    }
    box.appendChild(grid);
  }

  // ---------- track list ----------
  function renderList() {
    var c = cur(), box = $("list");
    box.textContent = "";
    $("listLabel").textContent = "tracks · " + state.tab + " · " + pad2(c.rows.length);
    if (!c.rows.length) {
      box.appendChild(h("div", { class: "none", text: c.q ? "no matches." : "empty." }));
      return;
    }
    c.rows.forEach(function (it, i) {
      var ep = it.ep || 0;
      var right = state.tab === "watching" ? pad2(ep) + "/" + (it.total ? pad2(it.total) : "??")
        : state.tab === "planned" ? (it.total ? pad2(it.total) + " eps" : "?? eps")
        : (it.rating ? "★" + it.rating : "★-");
      var row = h("button", { class: "trk", type: "button", "data-f": "600", "aria-current": String(c.it === it), onclick: function () { select(it.id); } },
        h("span", { class: "no", text: pad2(i + 1) }),
        h("span", { class: "t", text: it.title }),
        h("span", { class: "ep", text: right }));
      if (state.tab === "watching" && it.total) {
        var p = h("span", { class: "p" }), f = h("span");
        f.style.width = Math.min(100, Math.round((ep / it.total) * 100)) + "%";
        p.appendChild(f);
        row.appendChild(p);
      }
      box.appendChild(row);
    });
  }

  function render() {
    clearTimeout(renderTimer);
    document.body.setAttribute("data-tab", state.tab);
    renderModes();
    renderLcd();
    renderPad();
    renderKnob();
    renderDetail();
    renderList();
  }

  // ---------- events ----------
  $("snd").addEventListener("click", function () {
    state.snd = !state.snd;
    try { localStorage.setItem(SNDKEY, state.snd ? "1" : "0"); } catch (e) {}
    $("snd").setAttribute("aria-pressed", String(state.snd));
    blip(880);
  });
  function applyTheme(t, store) {
    document.documentElement.setAttribute("data-theme", t);
    $("thm").setAttribute("aria-pressed", String(t === "dark"));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", t === "dark" ? "#0E0E0D" : "#D2D2CE");
    if (store) { try { localStorage.setItem("watchlog.theme", t); } catch (e) {} }
  }
  $("thm").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
  });
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light", false);
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("fTitle").value.trim();
    if (!title) return;
    var total = parseInt($("fTotal").value, 10);
    var status = $("fList").value;
    var now = Date.now();
    var item = { id: uid(), title: title, status: status, ep: 0, total: total > 0 ? total : null, rating: 0, note: "", addedAt: now, updatedAt: now, finishedAt: null };
    if (status === "completed") { item.finishedAt = today(); item.ep = item.total || 0; }
    // A picked suggestion already carries its cover, so no second lookup is needed.
    var picked = sug.picked && sug.picked.title === title ? sug.picked : null;
    if (picked && picked.cover) { item.cover = picked.cover; item.coverSrc = "auto"; item.coverTried = true; }
    sug.picked = null;
    hideSug();
    state.items.push(item);
    persist();
    $("fTitle").value = ""; $("fTotal").value = "";
    state.q = ""; $("q").value = "";
    setTab(status);
    state.sel[status] = item.id;
    render();
    toast("Recorded to " + status + ".");
    if (!item.cover && navigator.onLine !== false) findCover(item, false);
  });

  $("coverFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    var item = byId(state.uploadFor);
    e.target.value = "";
    if (!f || !item) return;
    shrink(f).then(function (url) {
      state.coverFor = null;
      save(item, { cover: url, coverSrc: "custom", coverTried: true });
      toast("Cover saved.");
    }).catch(function () { toast("Could not read that image."); });
  });

  $("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify({ app: "watchlog", version: 1, exportedAt: new Date().toISOString(), items: state.items }, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = today() + "-anime-watchlog-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast("Backup saved to your Downloads.");
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(String(r.result));
        var incoming = Array.isArray(data) ? data : data.items;
        if (!Array.isArray(incoming)) throw new Error("bad");
        var byId = {};
        state.items.forEach(function (i) { byId[i.id] = i; });
        var added = 0;
        incoming.forEach(function (i) {
          if (!i || typeof i.title !== "string" || !i.title.trim()) return;
          if (["watching", "planned", "completed"].indexOf(i.status) === -1) return;
          if (!i.id) i.id = uid();
          if (!byId[i.id]) added++;
          byId[i.id] = i;
        });
        state.items = Object.keys(byId).map(function (k) { return byId[k]; });
        persist();
        render();
        toast("Imported. " + added + " new title" + (added === 1 ? "" : "s") + " added.");
      } catch (err) {
        toast("That file is not a Watchlog backup.");
      }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  load();
  $("fList").value = state.tab;
  $("snd").setAttribute("aria-pressed", String(state.snd));
  render();
  setTimeout(backfill, 1200);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
